# dig-download — the node-side multi-source download orchestrator for the DIG Node peer network.
#
# dig-download answers "get me this content, fast and verified": given a `ContentId` (store / root /
# capsule / resource), it (1) LOCATES the peers holding it via dig-dht `find_providers`, (2) confirms
# them + plans ranges via the L7 `dig.getAvailability`, (3) fans DIFFERENT byte ranges across
# DIFFERENT providers SIMULTANEOUSLY over dig-nat mux streams (`dig.fetchRange`), (4) VERIFIES each
# range independently against the capsule's chain-anchored merkle root, (5) RETRIES a bad/dropped
# range from another provider, and (6) REASSEMBLES the verified bytes in order into the node's store —
# with pause + resume that never refetches an already-verified range. This is the node engine that
# supersedes the retired browser-side `dig-download-utility`.
#
# Dependency philosophy (mirrors dig-dht / dig-nat): keep the tree SMALL and the network INJECTABLE.
# The orchestrator is written entirely against trait boundaries — `ProviderLocator` (locate holders),
# `RangeTransport` (fetch a range from a holder), `Sink` (write into the store), `StateStore` (persist
# resume progress), and `Verifier`/`ProofVerifier` (per-range + chain-anchored integrity) — so the
# whole scheduler / rebalance / verify / pause-resume machinery is tested over an IN-MEMORY harness
# (mock DHT + mock range sources + in-memory sink + in-memory state store, NO real network / mainnet).
# The real impls (`DhtProviderLocator` over dig-dht, `NatRangeTransport` over dig-nat) are thin
# adapters over those two crates; the store-backed `Sink` + digstore merkle `ProofVerifier` are wired
# by dig-node (see the implementers' note in the crate docs).
[package]
name = "dig-download"
version = "0.24.0"
edition = "2021"
rust-version = "1.75.0"
license = "Apache-2.0 OR MIT"
description = "Multi-source download orchestrator for the DIG Node peer network — locates content holders via dig-dht, fans byte ranges across multiple peers simultaneously over dig-nat (dig.fetchRange), verifies each range independently against the capsule's chain-anchored merkle root, rebalances around dropped/slow/bad sources, and reassembles into the node's store with pause + resume that never refetches a verified range."
repository = "https://github.com/DIG-Network/dig-download"
readme = "README.md"
keywords = ["download", "multisource", "p2p", "content", "dig"]
categories = ["network-programming"]

[dependencies]
# Canonical §5.3 endpoint literals (`RPC_DIG_NET_URL`, `DIG_LOCAL_HOST`, `DIG_NODE_PORT`) — the
# ecosystem SSOT (#1283). The §5.3 read-ladder re-exports these rather than re-deriving the values,
# so there is exactly ONE source of truth for the endpoints across the ecosystem. Foundation-level
# (L00), zero DIG deps. NC-7: prefer the crates.io release over bare-git.
#
# The 0.8 → 0.10 move is additive for the three literals this crate re-exports (0.9 added a profile
# sealing label; 0.10 is a dep-family migration inside dig-constants itself, from `chia-consensus`/
# `chia-protocol` ^0.26 to ^0.36.1).
#
# That migration used to cost a duplicate: dig-nat 0.18 required `dig-constants >=0.4, <0.6`, so the
# tree carried TWO dig-constants and hence two chia stacks. dig-nat 0.20 requires `^0.10`, both edges
# now agree, and the tree carries ONE copy on ONE chia line. `tests/dependency_tree.rs` fails if a
# second copy ever returns, because a second dig-constants is also a second chia stack.
#
# RELEASED to 0.11 (§2.4b). The hold recorded here was explicit — "Move both edges together when
# dig-nat adopts 0.11" — and dig-nat 0.21 is that adoption: it requires `dig-constants ^0.11.1`. A
# `0.x` MINOR is semver-INCOMPATIBLE, so the two edges must cross together or the tree carries TWO
# dig-constants, and a second dig-constants is a second chia stack.
# `tests/dependency_tree.rs` asserts exactly that, and its pinned line moves with this edge.
dig-constants = "0.11"

# LOCATE — "which peers hold this content?" dig-download derives a `ContentId` (store / root /
# capsule / resource) and asks dig-dht `find_providers` for the holders' `ProviderRecord`s.
#
# Sourcing: crates.io. dig-dht 0.12 keeps the SAME `find_providers` public API this crate consumes
# (`DhtService::find_providers` — the true distributed iterative lookup); its bump from 0.11 moved onto
# dig-nat 0.20 (below), so dig-dht + dig-peer + dig-download's direct dig-nat dep all agree on dig-nat
# 0.20 and the tree carries exactly ONE dig-nat instance (asserted by `tests/dependency_tree.rs`, not
# assumed).
#
# That agreement is why all THREE deps move in one commit. A 0.x MINOR is semver-INCOMPATIBLE, so
# bumping dig-nat alone produces a lock with multiple dig-nat entries and type mismatches on the
# `DigPeer::fetch_range` seam. Never bump one leg of this trio by itself — use release-first,
# coordinating all three releases.
#
# dig-dht defines its OWN `PeerId`/`ProviderRecord` types (NOT re-exported from dig-nat), and this
# crate RE-EXPORTS `ContentId`/`ProviderRecord`, so their identity is part of dig-download's public
# API — which is why this bump is breaking for consumers.
#
# `0.13` -> `0.15` (dig_ecosystem#3166). 0.14 added an OPTIONAL `unverified_mirror_coin_id` to
# `ProviderRecord`; 0.15 bounds `CandidateAddr::host` at the shared normalization helper. Neither
# touches `DhtService::find_providers`, and every construction site in this crate goes through
# `ProviderRecord::new` (unchanged), so the source delta is nil — but the RE-EXPORTED struct gains a
# public field, which makes this crate's own public API change and the bump breaking for consumers.
#
# dig-dht 0.15 requires `dig-nat ^0.21`, which is exactly the edge this crate already declares, so
# the tree still carries ONE dig-nat on ONE chia line. `tests/dependency_tree.rs` asserts that rather
# than assuming it.
# NC-7: prefer the crates.io release over bare-git.
dig-dht = "0.15"

# WIRE — the whole-`.dig`-module pull descriptor + method names (#1576). `ModuleInfo`
# (`total_size` / `module_hash` / `chunk_hashes` / `chunk_lens`) is the canonical byte-contract a
# `getModuleInfo` handshake returns; the `ModuleDownloader` consumes it directly rather than
# re-declaring the shape (single source of truth, no drift vs the dig-node serve leg). dig-rpc-protocol
# 0.11 is pinned to match dig-peer's dependency. Foundation-level (L00), zero DIG deps — a legal
# downward edge from L30. NC-7: prefer the crates.io release over bare-git.
#
# `0.10` -> `0.11` (dig_ecosystem#3269): additive-only (760 insertions / 2 manifest-version-line
# deletions vs 0.10.3; zero public item removed or renamed). Re-checked the three types this crate
# re-exports/constructs (`ModuleInfo`, `GetModuleInfoParams`, `RelayStatus`) against the published
# 0.11.0 source: none gained `#[non_exhaustive]`. This crate does not `match` on any type that DID
# (`ErrorCode`, `Method`, `RangeFrame`, `FetchRangeParams`, `GetAvailabilityParams`), so no wildcard
# arm is needed. Required because dig-node-core moved to the 0.11 line first and needs the reward
# RPC methods only 0.11.0 carries.
dig-rpc-protocol = "0.12"

# REACH + FETCH — the mTLS peer transport the range fetch rides: `dig.getAvailability` +
# `dig.fetchRange` over dig-nat mux streams, plus the wire shapes (`RangeRequest`, `RangeFrame`,
# `AvailabilityItem`/`Answer`/`Response`) and `PeerId`/`PeerTarget`/`NodeCert`/`connect`.
#
# Sourcing: crates.io 0.20. The dial API (`connect`/`connect_with_runtime`/`NatRuntime`) is unchanged;
# dig-nat re-exports dig-tls 0.4 for ALL cert/mTLS/peer_id/BLS-binding plumbing.
#
# 0.20 is where the chia-0.36 uplift reaches this crate, and it does so WITHOUT a chia type appearing
# anywhere in `src/`. dig-tls 0.4 re-exports `chia_bls::SecretKey` on the 0.36 line, and that key is
# the sole way to mint the `NodeCert` a caller hands to `NatRangeTransport`. So a consumer still on
# chia-bls 0.26 gets an `E0308` at the mint, not here — which is exactly why the invariant is
# asserted over the resolved lock rather than by grepping this crate for `chia`.
#
# 0.20 also continues the correctness + capability arc started in 0.12–0.14 (#1640): better framing
# bounds, wire resilience, paged reassembly for large ranges, and IPv6-first peer transport. The wire shapes
# (`RangeRequest`, `RangeFrame`, `AvailabilityItem`/`Answer`/`Response`) appear in this crate's public
# `RangeTransport` trait, so their identity is part of dig-download's public API and every dig-nat bump
# is breaking for consumers.
#
# The wire is CANONICAL in dig-nat; never re-declare or fork the shapes here. NC-7: prefer the
# crates.io release over bare-git.
#
# `0.20` -> `0.21` (dig_ecosystem#3159): dig-nat 0.21 requires a LIVE circuit with a 30s idle window
# before its duplicate guard suppresses a relayed dial. Before it, a stale circuit made a fresh
# relayed dial report `relayed failed ... elapsed_ms=0` — NEVER ATTEMPTED — which is the measured
# cause of a relayed circuit that forms and then carries zero bytes. This crate is the executor that
# would have carried those bytes, so the fix is squarely on its path even though the diff here is
# manifest-only: dig-nat 0.20..0.21 changes NO public API (its diff is `src/relay.rs` internals,
# SPEC.md and the manifest).
dig-nat = "0.21"

# REACH + FETCH via the shared client — dig-download talks to peers through `DigPeer`, the one DIG
# Network peer client (#1283), rather than driving dig-nat directly: `DigPeer::connect_with_runtime`
# (peer_id-PINNED mTLS over the full NAT ladder) + `get_availability` / `fetch_range`. dig-peer 0.12
# re-exports the SAME dig-nat 0.20 / dig-tls 0.4 shapes this crate already uses (`PeerTarget`,
# `RangeRequest`, `AvailabilityItem`/`AvailabilityResponse`, `NodeCert`, `PeerId`), so the tree still
# carries exactly ONE dig-nat + dig-tls instance. NC-7: prefer the crates.io release over bare-git.
#
# Kept on the same dig-rpc-protocol line (0.11) as this crate to collapse a `ModuleInfo` SHAPE SKEW,
# not merely to stay current (#1576). An earlier version skew held TWO `ModuleInfo` types either side
# of a trust boundary, on the very field (`chunk_lens`/`chunk_hashes`) that drives the whole pull plan —
# the #836 `serde_bytes`-vs-base64 class of defect that cost six diagnosis rounds. Pinning dig-peer to
# the SAME dig-rpc-protocol version as this crate prevents regression. dig-peer 0.12 also exports the
# `get_module_info` / `fetch_module_range` client methods dig-node's `ModuleTransport` adapter uses.
#
# `0.13` -> `0.14` (dig_ecosystem#3269): dig-peer moved its own dig-rpc-protocol requirement to 0.11
# for the same reason as this crate (dig-node-core needs the 0.11-only reward RPC methods); moving
# together here keeps both crates on the SAME dig-rpc-protocol line, which is the whole point of this
# pin. dig-peer 0.14 is a manifest-only bump (no public API change).
dig-peer = "0.15"

# Async runtime for the orchestrator task + the concurrent range fan-out + backoff timers.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util"] }
async-trait = "0.1"

# The concurrent range scheduler drives many in-flight (provider, range) fetches at once with a
# `FuturesUnordered`, topping up as sources finish/drop.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# Resume state (`StateStore`) + the file-backed store persist per-range progress as JSON so an
# interrupted (or paused) download resumes from the exact verified-range set.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Content integrity: `resource_leaf = SHA-256(concatenated chunk ciphertexts)` (L7 §9 / digstore
# merkle-proofs) — the whole-resource commitment a reassembled resource is verified against.
sha2 = "0.10"

# OPTIONAL — the ready-made HTTP `HealthProbe` for the §5.3 read-ladder (`HttpHealthProbe`, feature
# `http-probe`). The core ladder resolution is transport-free (trait-based); consumers that want the
# out-of-the-box `GET {base}/health` probe opt into reqwest via this feature, keeping the default
# dependency tree lean (the crate's "small tree" philosophy).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

# Structured errors + observability.
thiserror = "2"
tracing = "0.1"

[features]
# The ready-made HTTP health probe for the §5.3 read-ladder. Off by default (keeps reqwest out of the
# tree unless a consumer wants the built-in probe); the trait-based ladder works without it.
http-probe = ["dep:reqwest"]

# The in-memory test harness (`testkit`) AND the fail-OPEN `AcceptAnyModuleAnchor` it pairs with. OFF by
# default so a production consumer build cannot even name the no-op anchor verifier that would bypass the
# module pull's sole root of trust (#1576 security gate); a consumer unit-testing its own download wiring
# enables it as a dev-dependency feature.
testkit = []

[dev-dependencies]
# Self-dev-dependency so this crate's OWN integration tests (a separate crate) see the `testkit`
# feature, while a normal consumer build still gets it off by default.
dig-download = { path = ".", features = ["testkit"] }

# The in-memory harness spins up mock providers + mock range sources + an in-memory sink/state store
# in one process (NO real network). test-util drives the backoff timers deterministically.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

# Test-only: dig-nat's `NodeCert` (re-exported from dig-tls) is a private-field, CA-signed
# certificate with no public constructor besides `generate_signed`/`load_or_generate`/`from_pem`,
# which need a BLS identity `SecretKey`. dig-tls owns that type; not needed as a PRODUCTION
# dependency (dig-download's own code only ever holds/passes an `Arc<dig_nat::NodeCert>` it is
# handed, never mints one). Pinned to 0.4 to match the dig-tls that dig-nat 0.20 re-exports — two
# dig-tls majors in the test build would otherwise produce an E0308 type mismatch on `NodeCert`, and
# on 0.4 that mismatch is specifically a chia-bls one, since `SecretKey` comes straight through.
dig-tls = "0.4"

# NO `[profile.release] overflow-checks` here, DELIBERATELY (#1608).
#
# Only the ROOT package's profile applies to a build — a dependency's is IGNORED — so a library that
# sets `overflow-checks = true` protects nothing in the consumer builds that are the only ones that
# matter. Worse, it reads as protection: this crate's own profile did NOT guard `ChunkPlan::from_info`
# in a consumer build, and the only reason a hostile wrapping descriptor panicked early during
# diagnosis was that dig-node happens to set the flag itself. With it off, a wrapping descriptor was
# ACCEPTED (proven by execution).
#
# So every validator here is total over hostile input by CONSTRUCTION instead: `checked_add` /
# `try_fold` / `usize::try_from` on anything wire-derived (`ChunkPlan::from_info`,
# `ChunkLayout::try_new`, `sink::read_back_bounds`), and FALLIBLE `try_reserve_exact` for any
# allocation an untrusted length sizes. In a library, a wrapping add is a silent ACCEPT, not a panic —
# never delegate that to a profile flag. The `overflow-checks-off` CI job builds + runs the tests with
# the checks explicitly DISABLED so this class fails loudly if it ever creeps back.

